name: Build and publish

on:
  push:
    branches:
      - main  # just build the sdist & wheel, skip release
    tags:
      - "*"
  pull_request:  # also build on PRs touching these files
    paths:
      - ".github/workflows/release.yml"
      - "ci/*"
      - "**meson.build"
      - "pyproject.toml"
  schedule:
    # in addition run weekly for nightly upload in case no other commits happened
    - cron: '34 2 * * 0'
  workflow_dispatch:

env:
  GEOS_VERSION: "3.14.1"

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "pyproject.toml"

      - name: Build a source tarball
        run: |
          sudo -E apt-get update
          sudo -E apt-get autopurge -y needrestart
          sudo -E apt-get -yq --no-install-suggests --no-install-recommends install libgeos-dev
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build --sdist
          twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sdist
          path: ./dist/*.tar.gz
          retention-days: 30
          compression-level: 0

  build_wheels_linux:
    name: Build ${{ matrix.baseimage }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            baseimage: manylinux_2_28_x86_64
            cibw_build: "*manylinux_x86_64"
            arch: x86_64
          - os: ubuntu-latest
            baseimage: musllinux_1_2_x86_64
            cibw_build: "*musllinux_x86_64"
            arch: x86_64
          - os: ubuntu-24.04-arm
            baseimage: manylinux_2_28_aarch64
            cibw_build: "*manylinux_aarch64"
            arch: aarch64
          - os: ubuntu-24.04-arm
            baseimage: musllinux_1_2_aarch64
            cibw_build: "*musllinux_aarch64"
            arch: aarch64
    env:
      basetag: 2026.10.26-1

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-flags: --debug

      - name: Build Docker image with GEOS
        # using build-push-action (without push) to make use of cache arguments
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ci/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: ${{ matrix.baseimage }}_geos:${{ env.GEOS_VERSION }}
          build-args: |
            BASEIMAGE=quay.io/pypa/${{ matrix.baseimage }}:${{ env.basetag }}
            GEOS_VERSION=${{ env.GEOS_VERSION }}
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.baseimage }}
          cache-to: type=gha,mode=max,scope=${{ matrix.baseimage }}
        env:
          BUILDKIT_PROGRESS: plain

      - name: Add GEOS LICENSE
        run: cp ci/wheelbuilder/LICENSE_GEOS .
        shell: bash

      - name: Build wheels
        uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3 # v4.3.4
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.baseimage }}_geos:${{ env.GEOS_VERSION }}
          CIBW_MUSLLINUX_X86_64_IMAGE: ${{ matrix.baseimage }}_geos:${{ env.GEOS_VERSION }}
          CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.baseimage }}_geos:${{ env.GEOS_VERSION }}
          CIBW_MUSLLINUX_AARCH64_IMAGE: ${{ matrix.baseimage }}_geos:${{ env.GEOS_VERSION }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.baseimage }}
          path: ./wheelhouse/*.whl
          retention-days: 30
          compression-level: 0

  build_wheels_mac_win:
    name: Build ${{ matrix.arch }} wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x86
            msvc_arch: x86
          - os: windows-2025
            arch: AMD64
            msvc_arch: x64
          - os: windows-11-arm
            arch: ARM64
            msvc_arch: ARM64
          - os: macos-15-intel
            arch: x86_64
            cmake_osx_architectures: x86_64
          - os: macos-15
            arch: arm64
            cmake_osx_architectures: arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache GEOS build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/geos-${{ env.GEOS_VERSION }}
          key: ${{ matrix.os }}-${{ matrix.arch }}-${{ env.GEOS_VERSION }}-${{ hashFiles('ci/*') }}

      - name: Add GEOS LICENSE
        run: cp ci/wheelbuilder/LICENSE_GEOS .
        shell: bash

      - name: Add MSVC LICENSE
        run: cp ci/wheelbuilder/LICENSE_win32 .
        shell: bash
        if: ${{ startsWith(matrix.os, 'windows') }}

      - name: Activate MSVC
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: ${{ matrix.msvc_arch }}
          # TODO temporarily pin to older MSVC version to avoid crashes, remove once
          # there is a new GEOS bug-fix release (https://github.com/libgeos/geos/issues/1449)
          toolset: "14.44"
        if: ${{ matrix.msvc_arch }}

      - name: Build wheels
        uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3 # v4.3.4
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT_MACOS:
            GEOS_INSTALL=${{ runner.temp }}/geos-${{ env.GEOS_VERSION }}
            MACOSX_DEPLOYMENT_TARGET=10.9
            CMAKE_OSX_ARCHITECTURES='${{ matrix.cmake_osx_architectures }}'
            CFLAGS='-Wno-error=incompatible-function-pointer-types'
          CIBW_ENVIRONMENT_WINDOWS:
            GEOS_INSTALL='${{ runner.temp }}\geos-${{ env.GEOS_VERSION }}'
          CIBW_BEFORE_ALL_MACOS: ./ci/install_geos.sh
          CIBW_BEFORE_ALL_WINDOWS: ci\install_geos.cmd
          CIBW_CONFIG_SETTINGS:
            setup-args="-Dcmake_prefix_path=${{ runner.temp }}/geos-${{ env.GEOS_VERSION }}"
          CIBW_CONFIG_SETTINGS_WINDOWS:
            setup-args="-Dcmake_prefix_path=${{ runner.temp }}\geos-${{ env.GEOS_VERSION }}"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair --add-path ${{ runner.temp }}\geos-${{ env.GEOS_VERSION }}\bin -w {dest_dir} -v {wheel}
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl
          retention-days: 5
          compression-level: 0

  nightly_upload:
    name: Upload nightly wheels
    needs: [build_sdist, build_wheels_linux, build_wheels_mac_win]
    runs-on: ubuntu-latest
    if: github.repository == 'shapely/shapely' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Upload wheels to Anaconda Cloud
        uses: scientific-python/upload-nightly-action@16fa02eacee1655195143de09f03676e60ef2bf5 # 0.6.5
        with:
          artifacts_path: dist
          anaconda_nightly_upload_token: ${{secrets.ANACONDA_ORG_UPLOAD_TOKEN}}

  publish:
    name: Publish on GitHub and PyPI
    needs: [build_sdist, build_wheels_linux, build_wheels_mac_win]
    runs-on: ubuntu-latest
    # release on every tag
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/shapely
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing to PyPI
      contents: write # this permission is required for the Github release action

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            dist/shapely-*.tar.gz

      - name: Upload Release Assets to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
